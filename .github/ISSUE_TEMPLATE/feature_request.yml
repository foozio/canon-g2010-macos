name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need does this address? Is your printer model different from the G2010?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Constraints I understand
      options:
        - label: No sudo/root daemons or kernel extensions (this stays a user-space tool).
          required: true
        - label: New dependencies need strong justification (the app avoids them).
          required: false
