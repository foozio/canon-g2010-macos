name: Release DMG

# Builds the self-contained G2010 Manager DMG on Apple Silicon runners.
# Triggered by version tags (v*) or manually. The artifact is ad-hoc signed
# (no Developer ID secrets configured) — see SECURITY.md / THIRD_PARTY_NOTICES.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-dmg:
    name: Build self-contained DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install runtime & build dependencies
        run: |
          brew update >/dev/null
          brew install autoconf automake libtool pkg-config
          brew install cups sane-backends libusb libpng jpeg-turbo

      - name: Fetch Gutenprint 5.3.3 source
        run: |
          git clone --depth 1 --branch gutenprint-5_3_3 \
            https://git.code.sf.net/p/gimp-print/source gutenprint-src

      # Mirrors docs/06-BUILD-NOTES.md exactly (do NOT use autogen.sh).
      - name: Build Gutenprint natively (arm64)
        working-directory: gutenprint-src
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          ./configure \
            --prefix="$HOME/gp" \
            --without-gimp2 \
            --disable-libgutenprintui2 \
            --disable-samples \
            --disable-test \
            --disable-translated-cups-ppds \
            --without-doc
          make -j"$(sysctl -n hw.ncpu)"
          # make install errors at the very end on the root-owned cups backend
          # path; that hook is irrelevant for our prefix install.
          make install \
            cupsexec_backenddir="$HOME/gp/cupsexec/backend" \
            cupsexec_driverdir="$HOME/gp/cupsexec/driver" \
            cupsexec_filterdir="$HOME/gp/cupsexec/filter" || true
          test -x "$HOME/gp/cupsexec/filter/rastertogutenprint.5.3"
          chmod -R a+rX "$HOME/gp"

      - name: Run lifecycle test suite
        run: ./tests/test-printserver-control.sh

      - name: Build DMG
        run: bash G2010Manager/packaging/create-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: G2010-Manager-dmg
          path: G2010Manager/G2010-Manager-*.dmg

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: G2010Manager/G2010-Manager-*.dmg
